<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Friends | TripSync</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav>
        <h2>TripSync</h2>

        <div>
            <a href="{{ url_for('dashboard') }}">My Trips</a>
            <a href="{{ url_for('home') }}">Home</a>
        </div>
    </nav>

    <main class="dashboard-container">

        <h1>Add Friends 👥</h1>

        <p>
            Invite your friends to join your trip!
        </p>

        <form class="signup-form"
              method="POST"
              action="{{ url_for('add_friends') }}">

            <label for="trip_id">Choose a Trip</label>

            <select id="trip_id" name="trip_id" required>

                <option value="">
                    Select a trip
                </option>

                {% for trip in trips %}

                    <option value="{{ trip['id'] }}">
                        {{ trip['trip_name'] }} -
                        {{ trip['destination'] }}
                    </option>

                {% endfor %}

            </select>


            <label for="email">Friend's Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="friend@example.com"
                required
            >


            <button type="submit">
                Add Friend ✈️
            </button>

        </form>


        {% if message %}

            <div class="success-message">
                {{ message }}
            </div>

        {% endif %}


        <p>
            <a href="{{ url_for('dashboard') }}">
                ← Back to My Trips
            </a>
        </p>

    </main>

</body>

</html>
