<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Trip | TripSync</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav>
        <h2>TripSync</h2>

        <a href="index.html">Home</a>
        <a href="#">Trips</a>
        <a href="#">Expenses</a>
        <a href="#">Checklist</a>
    </nav>

    <div class="create-trip-container">

        <h1>Create Your Trip</h1>
        <p>Start planning something unforgettable with your crew! 🌴</p>
{% if message %}
    <p class="success-message">🎉 {{ message }}</p>
{% endif %}
        <form class="trip-form" method="POST" action="{{ url_for('create_trip') }}">

            <label for="trip-name">Trip Name</label>
            <input type="text" id="trip-name" name="trip_name" placeholder="Ex: Miami Girls Trip">

            <label for="destination">Destination</label>
            <input type="text" id="destination" name="destination" placeholder="Ex: Miami, Florida">

            <label for="start-date">Start Date</label>
            <input type="date" id="start-date" name="start_date">

            <label for="end-date">End Date</label>
            <input type="date" id="end-date" name="end_date">

            <label for="budget">Trip Budget</label>
            <input type="number" id="budget" name="budget" placeholder="Ex: 1500">

            <button type="submit">Create Trip ✈️</button>

        </form>

    </div>

</body>
</html>
